name: Telegram Bot Doi Soat GHN & Van Loi
on:
  repository_dispatch:
    types: [run-room1, run-room2, run-all]
  workflow_dispatch:
    inputs:
      target:
        description: 'Chon Room muon ban'
        required: true
        default: 'All'
        type: choice
        options:
          - All
          - Room1
          - Room2
jobs:
  run-bot:
    runs-on: windows-latest
    steps:
      - name: Lay ma nguon
        uses: actions/checkout@v4
      - name: Chay Bot PowerShell
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $eventType = "${{ github.event.action }}"
          $manualTarget = "${{ github.event.inputs.target }}"
          $room1 = "-1003837960650"
          $room2 = "-1002369053610"
          Write-Host "Event: $eventType | Target: $manualTarget"
          # 1. Neu la tin hieu ban cho Room 1:
          if ($eventType -eq "run-room1" -or $manualTarget -eq "Room1") {
              Write-Host "-> Ban cho Room 1"
              powershell -ExecutionPolicy Bypass -File .\bot.ps1 -TargetChatId $room1
          }
          # 2. Neu la tin hieu ban cho Room 2:
          elseif ($eventType -eq "run-room2" -or $manualTarget -eq "Room2") {
              Write-Host "-> Ban cho Room 2"
              powershell -ExecutionPolicy Bypass -File .\bot.ps1 -TargetChatId $room2
          }
          # 3. Mac dinh ban ca 2 Room:
          else {
              Write-Host "-> Ban cho ca 2 Room"
              powershell -ExecutionPolicy Bypass -File .\bot.ps1 -TargetChatId $room1
              Start-Sleep -Seconds 2
              powershell -ExecutionPolicy Bypass -File .\bot.ps1 -TargetChatId $room2
          }
